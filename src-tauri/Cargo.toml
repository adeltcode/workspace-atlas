[package]
name = "workspace-atlas"
version = "0.2.0"
description = "A Windows developer utility for managing Docker, WSL2, and packages."
authors = ["Patrick James Garcia"]
license = "MIT"
homepage = "https://github.com/adeltcode/workspace-atlas"
repository = "https://github.com/adeltcode/workspace-atlas"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workspace_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
sysinfo = "0.33"
# Blocking HTTP client (rustls TLS, no transfer compression) for streaming distro
# image downloads with byte-accurate progress.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Clipboard history is only available as a WinRT call, and Tauri already builds this version.
windows = { version = "0.61", features = ["ApplicationModel_DataTransfer", "Foundation_Collections", "Storage_Streams", "Win32_System_Com"] }
windows-future = "0.2"
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Wdk_System_SystemInformation", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

